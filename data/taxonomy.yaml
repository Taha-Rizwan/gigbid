# GigBid job taxonomy (v1). Used by scripts/build_dataset.py to categorise K1/K2/K3/K4 rows and by
# the agent's Analyst node. Rules: each keyword is a case-insensitive whole-word/phrase regex.
# score(category) = 3 * (#distinct title keyword hits) + 1 * (#distinct description keyword hits, capped at 4).
# The top-scoring category wins if its score >= 2; ties go to the category listed first (priority order);
# otherwise the job is `other`. `description` is the short text used for embedding fallback.
version: 1
min_score: 2
title_weight: 3
description_cap: 4
categories:
  ml_ai:
    description: Machine learning, AI and LLM work - model training, NLP, computer vision, chatbots, RAG, AI agents, prompt engineering.
    keywords: ['machine learning', 'deep learning', 'ml engineer', 'ai engineer', 'ai developer', 'artificial intelligence', 'llm', 'llms', 'large language model',
               'gpt', 'chatgpt', 'openai', 'langchain', 'llamaindex', 'rag', 'retrieval augmented', 'vector database', 'embeddings', 'fine[- ]?tun\w*', 'nlp',
               'natural language processing', 'computer vision', 'object detection', 'image classification', 'neural network', 'pytorch', 'tensorflow',
               'keras', 'hugging ?face', 'transformers?', 'ai chatbot', 'chatbot', 'ai agent', 'ai agents', 'prompt engineer\w*', 'generative ai', 'genai',
               'stable diffusion', 'yolo', 'opencv', 'predictive model\w*', 'classification model', 'recommendation system', 'recommender', 'data scientist',
               'data science', 'ml model', 'ai model', 'ai integration', 'ai-powered', 'ai powered']
  data_engineering:
    description: Data pipelines, ETL/ELT, data warehouses, orchestration, streaming and database engineering.
    keywords: ['data engineer\w*', 'etl', 'elt', 'data pipelines?', 'airflow', 'dbt', 'snowflake', 'bigquery', 'redshift', 'databricks', 'spark', 'pyspark', 'kafka',
               'data warehouse', 'data lake', 'fivetran', 'airbyte', 'data migration', 'data integration', 'database design', 'data modell?ing', 'dagster']
  data_analysis:
    description: Data analysis, BI dashboards, reporting, statistics, spreadsheets and visualisation.
    keywords: ['data analys[ti]\w*', 'data analytics', 'power ?bi', 'tableau', 'looker', 'looker studio', 'google data studio', 'dashboards?', 'kpi', 'reporting',
               'statistic\w*', 'statistical analysis', 'spss', 'stata', 'r programming', 'excel', 'spreadsheets?', 'google sheets', 'pivot tables?',
               'data visuali[sz]ation', 'sql', 'a/b test\w*', 'survey analysis', 'financial model\w*', 'vba', 'forecast\w*', 'regression']
  web_fullstack:
    description: Web application development - front end, back end, full stack, APIs, SaaS products, web frameworks.
    keywords: ['full[- ]?stack', 'front[- ]?end', 'back[- ]?end', 'web app\w*', 'web developer', 'web development', 'website development', 'react(?:\.?js)?',
               'next\.?js', 'vue(?:\.?js)?', 'angular', 'node(?:\.?js)?', 'express(?:\.?js)?', 'typescript', 'javascript', 'django', 'flask', 'fastapi', 'laravel',
               'php', 'ruby on rails', 'rails', 'rest api', 'api development', 'graphql', 'saas', 'mern', 'mean stack', 'supabase', 'firebase',
               'tailwind', 'html', 'css', 'bubble', 'webflow', 'wordpress developer', 'web application', 'mvp']
  mobile:
    description: Mobile app development for iOS and Android, cross-platform frameworks.
    keywords: ['mobile app\w*', 'ios', 'android', 'flutter', 'react native', 'swift(?:ui)?', 'kotlin', 'xcode', 'app store', 'play store', 'iphone app',
               'ipad', 'cross[- ]platform app', 'expo']
  ecommerce:
    description: E-commerce store setup and management - Shopify, WooCommerce, Amazon and marketplace listings.
    keywords: ['shopify', 'woocommerce', 'e-?commerce', 'amazon seller', 'amazon fba', 'fba', 'product listings?', 'etsy', 'ebay', 'magento', 'bigcommerce',
               'online store', 'dropshipping', 'walmart', 'product upload', 'store setup', 'listing optimi[sz]ation']
  devops_cloud:
    description: DevOps, cloud infrastructure, CI/CD, containers, Linux administration and security.
    keywords: ['devops', 'aws', 'azure', 'gcp', 'google cloud', 'kubernetes', 'k8s', 'docker', 'terraform', 'ansible', 'ci/?cd', 'jenkins', 'github actions',
               'linux', 'server admin\w*', 'sysadmin', 'cloud infrastructure', 'nginx', 'cybersecurity', 'penetration test\w*', 'network security',
               'site reliability', 'vps', 'hosting']
  automation_scraping:
    description: Web scraping, crawling, bots and workflow automation (Zapier, Make, n8n, RPA, browser automation).
    keywords: ['scrap\w*', 'crawl\w*', 'web scraping', 'data extraction', 'zapier', 'make\.com', 'integromat', 'n8n', 'automation', 'automate', 'workflow automation',
               'rpa', 'selenium', 'puppeteer', 'playwright', 'bot', 'bots', 'apps script', 'google apps script', 'api integration', 'airtable']
  design_3d:
    description: Graphic, UI/UX, brand, illustration, 3D modelling, CAD and animation design work.
    keywords: ['graphic design\w*', 'logo', 'branding', 'brand identity', 'ui/?ux', 'ux', 'ui design', 'figma', 'illustrat\w*', '3d', 'blender', 'cad',
               'autocad', 'solidworks', 'rendering', 'render', 'photoshop', 'canva', 'packaging design', 'poster', 'flyer', 'infographic',
               'character design', 'animation', 'animator', 'product design', 'interior design', 'architectural', 'nft art']
  video_audio:
    description: Video editing, motion graphics, audio, voice-over, podcast and music production.
    keywords: ['video edit\w*', 'video editor', 'youtube', 'tiktok video', 'motion graphics', 'after effects', 'premiere pro', 'reels', 'shorts',
               'voice[- ]?over', 'podcast', 'audio edit\w*', 'music', 'mixing', 'mastering', 'sound design', 'videographer', 'ugc', 'explainer video']
  marketing:
    description: Digital marketing, SEO, paid ads, social media management, email marketing, lead generation and sales.
    keywords: ['seo', 'search engine optimi[sz]ation', 'google ads', 'facebook ads', 'meta ads', 'ppc', 'paid ads', 'social media', 'instagram', 'tiktok',
               'linkedin', 'digital marketing', 'marketing strategy', 'email marketing', 'klaviyo', 'mailchimp', 'lead generation', 'leads',
               'cold calling', 'appointment setter', 'appointment setting', 'sales', 'affiliate', 'influencer', 'media buyer', 'growth hacking',
               'marketing manager', 'gohighlevel', 'go high level', 'crm']
  writing:
    description: Content writing, copywriting, blogging, editing, proofreading, technical writing and translation.
    keywords: ['writer', 'writing', 'copywrit\w*', 'content writ\w*', 'blog posts?', 'articles?', 'ghostwrit\w*', 'proofread\w*', 'editing', 'editor',
               'technical writ\w*', 'translat\w*', 'transcri\w*', 'ebook', 'script writer', 'scriptwriter', 'resume', 'grant writ\w*', 'seo content']
  finance_accounting:
    description: Bookkeeping, accounting, tax, financial analysis, payroll and legal/compliance support.
    keywords: ['bookkeep\w*', 'accounting', 'accountant', 'quickbooks', 'xero', 'tax', 'taxes', 'payroll', 'financial statements?', 'cpa', 'invoic\w*',
               'budgeting', 'financial analyst', 'legal', 'lawyer', 'attorney', 'compliance', 'contract drafting']
  admin_support:
    description: Virtual assistance, data entry, customer support, project management and research tasks.
    keywords: ['virtual assistant', 'va', 'data entry', 'admin\w* (?:assistant|support)', 'customer (?:service|support)', 'chat support',
               'executive assistant', 'project manager', 'project management', 'research assistant', 'online research', 'email management',
               'calendar management', 'typing', 'copy paste', 'personal assistant', 'customer success', 'operations assistant']
  other:
    description: Anything that does not match a more specific category (engineering, education, games, hardware, consulting, etc.).
    keywords: []

# Persona -> categories (used to build the dev/held-out mixes: ~50% core, 30% adjacent, 20% unrelated).
personas:
  ai_ml: {core: [ml_ai], adjacent: [data_analysis, data_engineering, automation_scraping]}
  fullstack: {core: [web_fullstack], adjacent: [ecommerce, mobile, devops_cloud]}
  data_analyst: {core: [data_analysis], adjacent: [data_engineering, ml_ai, admin_support]}

