[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:gigsim]
command=uvicorn gigsim.app:app --host 127.0.0.1 --port 8081 --log-level warning
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:mcp_marketplace]
command=python -m mcp_servers.marketplace.server
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:mcp_portfolio]
command=python -m mcp_servers.portfolio.server
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:mcp_workspace]
command=python -m mcp_servers.workspace.server
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:api]
command=uvicorn apps.api.main:app --host 127.0.0.1 --port 8000
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=30

[program:worker]
command=arq worker.main.WorkerSettings
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=40

[program:web]
command=node server.js
directory=/app/web
environment=PORT="7860",HOSTNAME="0.0.0.0",NODE_ENV="production"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=50
