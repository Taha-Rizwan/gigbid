# Hand-crafted persona specs (synthetic people). Every generated persona artefact
# (profile, CV, case studies, repos, reviews, past proposals) is derived from this file so the
# three personas stay internally consistent: dates, employers, clients and project names.
#
# Shared world (deliberate cross-links between personas):
#   * Brightcart (e-commerce retailer): Hannah worked there 2018-2021; Nadia did a freelance
#     review-mining project for them in 2023.
#   * Keystone Realty: Mateo built their internal CRM in 2021; Nadia built an LLM lead agent on
#     top of that CRM in 2024.
#   * Cargoline Freight: Mateo built their live dispatch board (2022); Nadia built their invoice
#     extraction (2023).
#   * Lumio Apps: Hannah's analytics client (2023).
#   * pandas: both Nadia and Hannah use it heavily.
#
# Field notes
#   stack      exact tool names. Per the data spec these should appear only in code or in ONE line
#              of prose, never repeatedly.
#   implied    phrases that describe the skill without naming the tool.
#   skills     generic skill words used in front matter (no product names).
#   repo       optional {slug, vague_readme, lang}. vague_readme=true -> README says little, code is clear.
#   review     optional {client_name, rating}.

