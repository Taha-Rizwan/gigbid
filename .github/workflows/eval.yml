name: Eval
on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GIGSIM_LLM_DISABLED: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.13.8"}
      - run: uv sync --frozen --extra dev
      - name: Skip when no model key is configured for this repository
        if: env.GROQ_API_KEY == ''
        run: echo "::warning::GROQ_API_KEY secret not set; smoke eval skipped" && exit 0
      - name: 30-job smoke eval with failure thresholds
        if: env.GROQ_API_KEY != ''
        run: make eval-smoke && uv run python -m evals.runners.check_thresholds evals/results/smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: smoke-eval, path: evals/results/smoke.json, if-no-files-found: ignore}
